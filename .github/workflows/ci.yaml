name: CI frontend

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  comprobaciones:
    name: Frontend (${{ matrix.comprobacion }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - comprobacion: componentes
            comando: npm run test -w @despacho/componentes-compartidos -- --maxWorkers=2
          - comprobacion: administrativo
            # Exclusión temporal de F-01: pendientes el mensaje esperado y los fixtures.
            # Sus fallos son locales a las pruebas; no requieren integrar Seguridad.
            comando: npm run test -w @despacho/administrativo -- --exclude 'src/features/zonas/**'
          - comprobacion: repartidor
            comando: npm run test -w @despacho/repartidor
          - comprobacion: tipos-y-compilacion
            comando: npm run typecheck && npm run build
          - comprobacion: e2e-f02
            comando: npm run test:f02:e2e
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Node.js 22 y la caché de npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar las dependencias del monorepositorio
        run: npm ci

      - name: Preparar Chromium para las pruebas de navegador
        if: matrix.comprobacion == 'e2e-f02'
        run: npx playwright install --with-deps chromium

      # F-02 intercepta las APIs; F-01 y F-04 requieren entornos backend aislados.
      - name: Ejecutar la comprobación
        run: ${{ matrix.comando }}

      - name: Conservar las capturas y resultados de navegador
        if: ${{ always() && matrix.comprobacion == 'e2e-f02' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pruebas-e2e-f02
          path: |
            test-results/
            docs/evidencia/f02/
          if-no-files-found: ignore
          retention-days: 7
