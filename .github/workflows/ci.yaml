name: CI/CD frontend

# Cadena: instalar y probar + revisión de seguridad -> construir artefactos -> compuerta
#         -> desplegar (Vercel) -> verificar.
# Vercel solo promueve a producción un commit de main cuando la compuerta "CI frontend verde" pasó.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Solo se cancelan ejecuciones obsoletas de PR; un push a develop/main termina siempre.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # 1. COMPILAR Y PROBAR
  # ---------------------------------------------------------------------------
  comprobaciones:
    name: Frontend (${{ matrix.comprobacion }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - comprobacion: componentes
            comando: npm run test -w @despacho/componentes-compartidos -- --maxWorkers=2
          - comprobacion: administrativo
            comando: npm run test -w @despacho/administrativo
          - comprobacion: repartidor
            comando: npm run test -w @despacho/repartidor
          - comprobacion: tipos-y-compilacion
            comando: npm run typecheck && npm run build
          - comprobacion: e2e-f02
            comando: npm run test:f02:e2e
          - comprobacion: e2e-flota
            comando: npm run test:flota:e2e
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Node.js 22 y la caché de npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar las dependencias del monorepositorio
        run: npm ci

      - name: Preparar Chromium para las pruebas de navegador
        if: startsWith(matrix.comprobacion, 'e2e-')
        run: npx playwright install --with-deps chromium

      # F-02 intercepta las APIs; F-01 y F-04 requieren entornos backend aislados.
      - name: Ejecutar la comprobación
        run: ${{ matrix.comando }}

      - name: Conservar las capturas y resultados de navegador
        if: ${{ !cancelled() && startsWith(matrix.comprobacion, 'e2e-') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pruebas-${{ matrix.comprobacion }}
          path: |
            test-results/
            docs/evidencia/f02/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 1b. REVISIÓN DE SEGURIDAD: dependencias npm
  #     OWASP Top 10:2025 A03 (Supply Chain) y A08 (Integrity).
  #     - npm audit: falla si una dependencia que llega a producción tiene una
  #       vulnerabilidad high o critical. El informe completo (incluidas las de
  #       desarrollo) se conserva como artefacto.
  #     - npm audit signatures: verifica las firmas del registro de los paquetes
  #       instalados desde el lockfile, para detectar paquetes alterados.
  # ---------------------------------------------------------------------------
  dependencias:
    name: Seguridad (dependencias npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Node.js 22 y la caché de npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar exactamente el lockfile
        run: npm ci --ignore-scripts

      - name: Verificar las firmas del registro
        run: npm audit signatures

      - name: Auditar las dependencias de producción
        shell: bash
        run: |
          set -uo pipefail
          npm audit --json > npm-audit-completo.json || true
          if npm audit --omit=dev --audit-level=high; then
            echo "npm audit: sin vulnerabilidades high/critical en dependencias de producción." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Hay dependencias de producción con vulnerabilidades high o critical. Ejecutar npm audit fix o actualizar el paquete."
            echo "npm audit: **vulnerabilidades high/critical en producción**." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Conservar el informe de dependencias
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seguridad-dependencias
          path: npm-audit-completo.json
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 1c. REVISIÓN DE SEGURIDAD: secretos en el código y en el historial
  #     OWASP Top 10:2025 A02 (Security Misconfiguration) y A08 (Integrity).
  #     gitleaks revisa todos los commits; el informe se guarda con los valores
  #     ocultos (--redact). El binario se descarga por versión fija y se verifica
  #     su SHA-256 antes de ejecutarlo.
  # ---------------------------------------------------------------------------
  secretos:
    name: Seguridad (secretos en el historial)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION_GITLEAKS: '8.30.1'
      SHA256_GITLEAKS: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Obtener el código con todo el historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Instalar gitleaks verificado
        shell: bash
        run: |
          set -euo pipefail
          archivo="gitleaks_${VERSION_GITLEAKS}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --output "${RUNNER_TEMP}/${archivo}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION_GITLEAKS}/${archivo}"
          echo "${SHA256_GITLEAKS}  ${RUNNER_TEMP}/${archivo}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archivo}" -C "${RUNNER_TEMP}" gitleaks

      - name: Buscar secretos en todos los commits
        shell: bash
        run: |
          set -uo pipefail
          if "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --verbose \
              --report-format json --report-path gitleaks-informe.json .; then
            echo "gitleaks: no se encontraron secretos en el historial." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::gitleaks encontró posibles secretos. Revocar y rotar la credencial antes de limpiar el historial."
            echo "gitleaks: **posibles secretos encontrados** (ver el informe)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Conservar el informe de secretos (valores ocultos)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seguridad-secretos
          path: gitleaks-informe.json
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. CONSTRUIR los paquetes estáticos de cada aplicación (build de producción)
  #    y conservarlos como artefacto versionado por ejecución.
  # ---------------------------------------------------------------------------
  construccion:
    name: Construir (${{ matrix.app }})
    needs: [comprobaciones, dependencias, secretos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: administrativo
            paquete: '@despacho/administrativo'
            directorio: apps/despacho-administrativo
          - app: repartidor
            paquete: '@despacho/repartidor'
            directorio: apps/despacho-repartidor
    env:
      # Mismo valor que usa Vercel; si no hay variable del repositorio, se usa el Gateway publicado.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://taller-api-gateway.onrender.com' }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Node.js 22 y la caché de npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar las dependencias del monorepositorio
        run: npm ci

      - name: Compilar la aplicación para producción
        env:
          PAQUETE: ${{ matrix.paquete }}
        run: npm run build -w "$PAQUETE"

      - name: Comprobar el paquete generado
        env:
          DIRECTORIO: ${{ matrix.directorio }}
        run: |
          set -euo pipefail
          test -s "${DIRECTORIO}/dist/index.html" || { echo "::error::No se generó ${DIRECTORIO}/dist/index.html"; exit 1; }
          grep -q 'id="root"' "${DIRECTORIO}/dist/index.html" || { echo "::error::index.html no contiene el contenedor raíz"; exit 1; }
          du -sh "${DIRECTORIO}/dist"

      - name: Conservar el paquete de producción
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.app }}
          path: ${{ matrix.directorio }}/dist/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. COMPUERTA: un único check que resume todo lo anterior, incluida la
  #    revisión de seguridad. Vercel solo promueve a producción si pasa.
  #    Es el que conviene exigir en la protección de ramas (no depende de la matriz).
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI frontend verde
    if: ${{ always() }}
    needs: [comprobaciones, dependencias, secretos, construccion]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Exigir que todas las etapas hayan salido bien
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados de las etapas: ${RESULTADOS}"
          for resultado in ${RESULTADOS}; do
            if [ "${resultado}" != "success" ]; then
              echo "::error::Alguna etapa no terminó en success (${RESULTADOS}). No se debe integrar ni desplegar."
              exit 1
            fi
          done

  # ---------------------------------------------------------------------------
  # 4. DESPLEGAR: lo hace Vercel con su integración de Git, gobernado por
  #    Deployment Checks. Vercel construye cada push a main, pero solo lo promueve
  #    a producción cuando el check "CI frontend verde" de este workflow pasa.
  #    Si falla, producción conserva la versión anterior.
  # 5. VERIFICAR: tras la compuerta, se comprueba que ambas aplicaciones publicadas
  #    respondan y entreguen la SPA. Requiere las variables URL_* (ver README).
  # ---------------------------------------------------------------------------
  verificar-produccion:
    name: Verificar producción (Vercel)
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    needs: [ci-ok]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: verificacion-frontend-produccion
      cancel-in-progress: false
    steps:
      # Vercel promueve el despliegue al ver la compuerta en verde: se espera antes de consultar.
      - name: Verificar las aplicaciones publicadas
        env:
          URL_ADMINISTRATIVO: ${{ vars.URL_ADMINISTRATIVO }}
          URL_REPARTIDOR: ${{ vars.URL_REPARTIDOR }}
        run: |
          set -uo pipefail
          faltan=0
          for nombre in ADMINISTRATIVO REPARTIDOR; do
            var="URL_${nombre}"
            if [ -z "${!var}" ]; then
              echo "::error::Falta la variable URL_${nombre} (Settings > Secrets and variables > Actions > Variables)."
              faltan=1
            fi
          done
          [ "${faltan}" -eq 0 ] || exit 1

          # Devuelve 0 si la URL responde 200 y entrega el index de la SPA.
          comprobar() {
            local url="$1" cuerpo codigo
            cuerpo="$(mktemp)"
            codigo="$(curl --silent --location --max-time 20 --output "${cuerpo}" --write-out '%{http_code}' "${url}" || echo 000)"
            if [ "${codigo}" = "200" ] && grep -q 'id="root"' "${cuerpo}"; then
              return 0
            fi
            echo "  ${url} -> HTTP ${codigo}"
            return 1
          }

          sleep 60
          for intento in $(seq 1 15); do
            echo "Intento ${intento} de 15"
            correcto=1
            for base in "${URL_ADMINISTRATIVO%/}" "${URL_REPARTIDOR%/}"; do
              # La raíz y una ruta profunda comprueban la reescritura SPA de vercel.json.
              comprobar "${base}/" || correcto=0
              comprobar "${base}/ruta-profunda-ci" || correcto=0
            done
            if [ "${correcto}" -eq 1 ]; then
              {
                echo "### Producción verificada"
                echo "Commit \`${GITHUB_SHA}\`: ambas aplicaciones responden 200 y entregan la SPA."
                echo "Vercel lo promueve a producción por Deployment Checks al pasar \`CI frontend verde\`."
              } | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Las aplicaciones no respondieron correctamente. Revisar el panel de Vercel."
          exit 1
